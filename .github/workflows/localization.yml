name: Localization validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check locales, terminology, interpolation and language switching contracts
        run: npm run test:localization
      - name: Build all languages
        run: npm run build
