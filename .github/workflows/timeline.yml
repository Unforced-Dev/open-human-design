name: Timeline validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run timeline unit tests
        run: npm run test:timeline

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Start development server
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/timeline-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/timeline-vite.log
          exit 1

      - name: Run timeline browser tests
        env:
          E2E_URL: http://127.0.0.1:5173
          CHROME_CHANNEL: chromium
          SKIP_TIMELINE_YEAR: "1"
        run: npm run e2e:timeline

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/timeline-vite.log || true
